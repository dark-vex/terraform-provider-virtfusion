name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GoReleaser needs full history/tags for changelog generation
          # (https://goreleaser.com/ci) — actions/checkout's default shallow
          # clone left it unable to find any prior tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      # GPG signing removed: no GPG_PRIVATE_KEY secret was ever configured,
      # and the fingerprint previously hardcoded here belonged to the
      # original upstream maintainer, not this fork. This fork isn't
      # published to the Terraform Registry (see README), so registry-grade
      # signing isn't required. Revisit if that changes.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
