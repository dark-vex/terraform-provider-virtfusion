project_name: terraform-provider-virtfusion

before:
  hooks:
    - go mod tidy

builds:
  - id: terraform-provider-virtfusion
    main: .
    # Binary inside the archive should include the leading "v"
    binary: terraform-provider-virtfusion_v{{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: zip
    # Archive filename must NOT include the leading "v"
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  # Checksums filename must NOT include the leading "v" (already correct)
  name_template: "terraform-provider-virtfusion_{{ .Version }}_SHA256SUMS"

# GPG signing intentionally removed: the fingerprint here was the original
# upstream maintainer's key (inherited via fork), not one this fork holds
# the private half of, and no GPG_PRIVATE_KEY secret was ever configured —
# every release run would have failed at this step even once triggering was
# fixed. This fork isn't published to the Terraform Registry (see README),
# so registry-grade signing isn't required. Tracked as a follow-up if that
# ever changes.

release:
  github:
    owner: dark-vex
    name: terraform-provider-virtfusion
